[project]
name = "api"
version = "0.1.0"
description = "FastAPI based API service"
readme = "README.md"
requires-python = ">=3.13, <4.0"
license = {text = "UNLICENSED"}
dependencies = [
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.31.0",
  "fastapi[all]>=0.136.1",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "phonenumbers>=9.0.29",
  "pyotp>=2.9.0",
  "python-jose>=3.5.0",
  "sqlalchemy[asyncio]>=2.0.49",
  "slowapi>=0.1.9",
  "starlette>=1.0.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pytest-watcher>=0.4.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["api", "auth", "audits", "common", "users"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 85
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

exclude = [
    ".git",
    ".ruff_cache",
    ".tox",
    ".venv"
]
