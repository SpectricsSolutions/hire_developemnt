name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - staging

jobs:
  terraform:
    name: Terraform Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4

      - run: terraform fmt -check -recursive infra/

      - name: Validate staging
        working-directory: infra/environments/staging
        run: terraform init -backend=false && terraform validate

      - name: Validate production
        working-directory: infra/environments/production
        run: terraform init -backend=false && terraform validate

  api:
    name: API Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Lint
        working-directory: api
        run: uv run ruff check . && uv run ruff format --check .

  test:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen --group dev

      - name: Run tests
        working-directory: api
        env:
          ENVIRONMENT: TESTING
        run: uv run pytest

  app:
    name: App Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: app
        run: pnpm lint

      - name: Test
        working-directory: app
        run: pnpm test

      - name: Build
        working-directory: app
        run: pnpm build

  push:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [terraform, api, app, test]
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "name=production" >> $GITHUB_OUTPUT
          else
            echo "name=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ENV: ${{ steps.env.outputs.name }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/$ENV/api
          docker build -t $IMAGE:$SHA -t $IMAGE:latest .
          docker push $IMAGE:$SHA
          docker push $IMAGE:latest

      - name: Deploy to ECS
        env:
          ENV: ${{ steps.env.outputs.name }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/$ENV/api:$SHA

          for SERVICE in api worker; do
            FAMILY=$ENV-$SERVICE
            TASK_DEF=$(aws ecs describe-task-definition --task-definition $FAMILY --query taskDefinition)
            NEW_TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$IMAGE" '
              .containerDefinitions[0].image = $IMAGE |
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            ')
            NEW_ARN=$(aws ecs register-task-definition \
              --cli-input-json "$NEW_TASK_DEF" \
              --query taskDefinition.taskDefinitionArn \
              --output text)
            aws ecs update-service \
              --cluster $ENV \
              --service $SERVICE \
              --task-definition $NEW_ARN \
              --query service.serviceArn \
              --output text
          done
