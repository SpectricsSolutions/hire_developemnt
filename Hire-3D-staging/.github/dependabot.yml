version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "yashpokar"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(app)"
      include: "scope"
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      build-tools:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "typescript*"
      linting:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier*"
      styling:
        patterns:
          - "tailwindcss*"
          - "@tailwindcss/*"

  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "yashpokar"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(api)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "yashpokar"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
